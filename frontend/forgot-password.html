<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Vani Technologies</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#1c2332] text-slate-100 min-h-screen flex flex-col justify-between antialiased brand-pinstripes selection:bg-[#e85827] selection:text-white">
  
  <!-- Top Navigation -->
  <header class="navbar-initial sticky top-0 z-50 w-full border-b border-[#60697d]/20 bg-[#161c28]/95 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 group">
        <div class="logo-shimmer-wrapper p-1 rounded-xl bg-[#232a39]/80 border border-[#60697d]/20 transition-all duration-300 group-hover:border-[#e85827]/40">
          <img src="assets/images/logo.png" alt="Vani Technologies" class="h-10 sm:h-12 w-auto object-contain rounded-lg">
        </div>
      </a>
      <a href="login.html" class="text-xs sm:text-sm font-medium text-slate-300 hover:text-white transition-colors flex items-center gap-2 px-3.5 py-2 rounded-lg hover:bg-white/5 border border-transparent hover:border-[#60697d]/30">
        <i class="fa-solid fa-arrow-left text-[#e85827]"></i>
        <span>Back to Login</span>
      </a>
    </div>
  </header>

  <!-- Forgot Password Main Content -->
  <main class="flex-grow flex items-center justify-center px-4 py-12 relative overflow-hidden">
    <!-- Ambient Glows -->
    <div class="absolute -top-32 left-1/3 w-80 h-80 bg-[#e85827]/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 right-1/3 w-80 h-80 bg-[#3b82f6]/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-md w-full p-8 sm:p-10 rounded-2xl bg-[#252e40]/75 border border-[#60697d]/35 backdrop-blur-xl shadow-2xl relative z-10">
      
      <!-- Card Header -->
      <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-[#e85827]/20 to-[#da251d]/10 border border-[#e85827]/40 text-[#e85827] flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg">
          <i class="fa-solid fa-key"></i>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-white font-heading tracking-tight">Reset Password</h1>
        <p id="step-description" class="text-xs sm:text-sm text-slate-300 mt-2">
          Enter your registered email or phone to receive a password reset code.
        </p>
      </div>

      <!-- Alert Notification Container -->
      <div id="forgot-alert" class="hidden mb-6"></div>

      <!-- STEP 1: Request Reset Code Form -->
      <form id="step1-form" class="space-y-5" novalidate>
        <div>
          <label for="forgot-identifier" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
            Registered Email or Phone
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-user-shield text-sm"></i>
            </div>
            <input 
              type="text" 
              id="forgot-identifier" 
              name="identifier" 
              placeholder="e.g. name@company.com or 9876543210" 
              class="w-full pl-10 pr-4 py-3 rounded-xl bg-[#161c28]/90 border border-[#60697d]/35 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-[#e85827] focus:ring-1 focus:ring-[#e85827] transition-all"
              required
            >
          </div>
        </div>

        <button 
          type="submit" 
          id="step1-submit-btn" 
          class="btn-primary w-full py-3.5 rounded-xl text-white font-semibold text-sm flex items-center justify-center gap-2 shadow-lg transition-all"
        >
          <span id="step1-btn-text">Generate Reset Code</span>
          <i id="step1-btn-icon" class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </form>

      <!-- STEP 2: Enter Reset Code & New Password Form (Hidden Initially) -->
      <form id="step2-form" class="hidden space-y-4" novalidate>
        
        <!-- Reset Code / Token -->
        <div>
          <label for="reset-token-input" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
            6-Digit Reset Code
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-hashtag text-sm"></i>
            </div>
            <input 
              type="text" 
              id="reset-token-input" 
              name="resetToken" 
              placeholder="Enter 6-digit code" 
              maxlength="6"
              class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-[#161c28]/90 border border-[#60697d]/35 text-white placeholder-slate-500 text-sm font-mono tracking-widest focus:outline-none focus:border-[#e85827] focus:ring-1 focus:ring-[#e85827] transition-all"
              required
            >
          </div>
        </div>

        <!-- New Password -->
        <div>
          <label for="new-password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
            New Password <span class="text-slate-400 font-normal lowercase">(min 8 characters)</span>
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-lock text-sm"></i>
            </div>
            <input 
              type="password" 
              id="new-password" 
              name="newPassword" 
              placeholder="Enter new password" 
              class="w-full pl-10 pr-10 py-2.5 rounded-xl bg-[#161c28]/90 border border-[#60697d]/35 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-[#e85827] focus:ring-1 focus:ring-[#e85827] transition-all"
              required
            >
            <button 
              type="button" 
              id="toggle-new-password" 
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white transition-colors"
              aria-label="Toggle password visibility"
            >
              <i class="fa-solid fa-eye text-sm"></i>
            </button>
          </div>
        </div>

        <!-- Confirm New Password -->
        <div>
          <label for="confirm-new-password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
            Confirm New Password
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-shield-halved text-sm"></i>
            </div>
            <input 
              type="password" 
              id="confirm-new-password" 
              name="confirmPassword" 
              placeholder="Confirm new password" 
              class="w-full pl-10 pr-10 py-2.5 rounded-xl bg-[#161c28]/90 border border-[#60697d]/35 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-[#e85827] focus:ring-1 focus:ring-[#e85827] transition-all"
              required
            >
            <button 
              type="button" 
              id="toggle-confirm-new-password" 
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white transition-colors"
              aria-label="Toggle confirm password visibility"
            >
              <i class="fa-solid fa-eye text-sm"></i>
            </button>
          </div>
          <span id="reset-match-text" class="hidden text-[11px] mt-1 block"></span>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="step2-submit-btn" 
          class="btn-primary w-full py-3.5 rounded-xl text-white font-semibold text-sm flex items-center justify-center gap-2 shadow-lg transition-all mt-4"
        >
          <span id="step2-btn-text">Update Password &amp; Sign In</span>
          <i id="step2-btn-icon" class="fa-solid fa-check text-xs"></i>
        </button>

      </form>

      <!-- Footer Navigation -->
      <div class="mt-8 pt-6 border-t border-[#60697d]/20 text-center text-xs text-slate-400">
        <span>Remember your password?</span>
        <a href="login.html" class="text-[#e85827] font-semibold hover:underline ml-1">
          Sign In Here
        </a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="py-6 border-t border-[#60697d]/20 bg-[#161c28] text-center text-xs text-slate-400">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
      <p>© 2026 Vani Technologies. All rights reserved.</p>
      <div class="flex items-center gap-4">
        <a href="mailto:support@vanitechnologies.in" class="hover:text-white transition-colors">support@vanitechnologies.in</a>
      </div>
    </div>
  </footer>

  <!-- Auth Script -->
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.setupPasswordToggle('toggle-new-password', 'new-password');
      Auth.setupPasswordToggle('toggle-confirm-new-password', 'confirm-new-password');

      const step1Form = document.getElementById('step1-form');
      const step2Form = document.getElementById('step2-form');
      const stepDesc = document.getElementById('step-description');
      const tokenInput = document.getElementById('reset-token-input');
      const newPassInput = document.getElementById('new-password');
      const confirmPassInput = document.getElementById('confirm-new-password');
      const matchText = document.getElementById('reset-match-text');

      // Live match check
      confirmPassInput.addEventListener('input', () => {
        if (!confirmPassInput.value) {
          matchText.className = 'hidden text-[11px] mt-1 block';
          return;
        }
        if (confirmPassInput.value === newPassInput.value) {
          matchText.textContent = '✓ Passwords match';
          matchText.className = 'text-[11px] text-emerald-400 mt-1 block';
        } else {
          matchText.textContent = '✕ Passwords do not match';
          matchText.className = 'text-[11px] text-red-400 mt-1 block';
        }
      });

      // Step 1: Request Code
      step1Form.addEventListener('submit', async (e) => {
        e.preventDefault();
        Auth.hideAlert('forgot-alert');

        const identifier = document.getElementById('forgot-identifier').value.trim();
        if (!identifier) {
          Auth.showAlert('forgot-alert', 'Please enter your registered email or phone.');
          return;
        }

        const submitBtn = document.getElementById('step1-submit-btn');
        const btnText = document.getElementById('step1-btn-text');
        const btnIcon = document.getElementById('step1-btn-icon');

        submitBtn.disabled = true;
        btnText.textContent = 'Generating code...';
        btnIcon.className = 'fa-solid fa-spinner fa-spin text-xs';

        try {
          const res = await Auth.forgotPassword({ identifier });

          if (res.ok && res.success) {
            Auth.showAlert(
              'forgot-alert',
              res.resetToken 
                ? `Reset code generated: <strong class="font-mono text-emerald-300 text-sm tracking-widest">${res.resetToken}</strong> (valid for 15 minutes).`
                : 'A reset code has been sent to your registered address.',
              'success'
            );

            // Auto-fill token if returned for developer convenience
            if (res.resetToken) {
              tokenInput.value = res.resetToken;
            }

            // Transition to Step 2
            step1Form.classList.add('hidden');
            step2Form.classList.remove('hidden');
            stepDesc.textContent = 'Enter the 6-digit code and your new password below.';
            newPassInput.focus();
          } else {
            Auth.showAlert('forgot-alert', res.message || 'Could not process request.');
            submitBtn.disabled = false;
            btnText.textContent = 'Generate Reset Code';
            btnIcon.className = 'fa-solid fa-paper-plane text-xs';
          }
        } catch (err) {
          Auth.showAlert('forgot-alert', 'Network error. Please try again.');
          submitBtn.disabled = false;
          btnText.textContent = 'Generate Reset Code';
          btnIcon.className = 'fa-solid fa-paper-plane text-xs';
        }
      });

      // Step 2: Reset Password
      step2Form.addEventListener('submit', async (e) => {
        e.preventDefault();
        Auth.hideAlert('forgot-alert');

        const resetToken = tokenInput.value.trim();
        const newPassword = newPassInput.value;
        const confirmPassword = confirmPassInput.value;

        if (!resetToken || !newPassword || !confirmPassword) {
          Auth.showAlert('forgot-alert', 'Please fill in all fields.');
          return;
        }

        if (newPassword.length < 8) {
          Auth.showAlert('forgot-alert', 'New password must be at least 8 characters long.');
          newPassInput.focus();
          return;
        }

        if (newPassword !== confirmPassword) {
          Auth.showAlert('forgot-alert', 'Passwords do not match.');
          confirmPassInput.focus();
          return;
        }

        const submitBtn = document.getElementById('step2-submit-btn');
        const btnText = document.getElementById('step2-btn-text');
        const btnIcon = document.getElementById('step2-btn-icon');

        submitBtn.disabled = true;
        btnText.textContent = 'Updating password...';
        btnIcon.className = 'fa-solid fa-spinner fa-spin text-xs';

        try {
          const res = await Auth.resetPassword({
            resetToken,
            newPassword,
            confirmPassword,
          });

          if (res.ok && res.success) {
            Auth.showAlert(
              'forgot-alert',
              'Password reset successful! Redirecting to sign in...',
              'success'
            );
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 1200);
          } else {
            Auth.showAlert('forgot-alert', res.message || 'Invalid or expired code. Please request a new one.');
            submitBtn.disabled = false;
            btnText.textContent = 'Update Password & Sign In';
            btnIcon.className = 'fa-solid fa-check text-xs';
          }
        } catch (err) {
          Auth.showAlert('forgot-alert', 'Network error. Please try again.');
          submitBtn.disabled = false;
          btnText.textContent = 'Update Password & Sign In';
          btnIcon.className = 'fa-solid fa-check text-xs';
        }
      });
    });
  </script>
</body>
</html>
